name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash .github/scripts/check_package_version.sh "${{ github.event.pull_request.base.sha }}"

  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path: [packages/academy_ui, apps/academy_ui_catalog]
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
