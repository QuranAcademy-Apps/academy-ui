name: academy_ui_catalog
description: Interactive Academy UI component catalogue.
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.13.2
dependencies:
  flutter:
    sdk: flutter
  academy_ui:
    path: ../../packages/academy_ui
  # The theme academy_ui hands out (`AcademyThemeData.cupertino`) is this
  # package's, not the SDK's `flutter/cupertino.dart` (deprecated since 3.47).
  cupertino_ui: ^1.0.2
  shared_preferences: ^2.5.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Flutter desktop text-selection menus may use the SDK fallback font.
flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: true
